[project]
name = "optiway"
version = "0.1.0"
description = "Multi-stop route optimization demo for mobile web (H5)"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.8.0,<3.0.0",
    "pytest>=8.0.0,<10.0.0",
    "ruff>=0.16.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
exclude = ["static"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["app/static", "scripts", "hooks", "packages", "img"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"
